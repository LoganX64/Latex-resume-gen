<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbc3d1"/>
      <stop offset="1" stop-color="#f7a9bd"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7b9b"/>
      <stop offset="1" stop-color="#f9185d"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffafb"/>
      <stop offset="1" stop-color="#fff6f8"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb7185"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".16"/>
    </filter>
  </defs>

  <!-- back document -->
  <g transform="rotate(-10 500 570)" filter="url(#shadow)">
    <rect x="145" y="340" width="660" height="600" rx="82" fill="url(#back)"/>
  </g>

  <!-- middle document -->
  <g transform="rotate(-7 520 540)" filter="url(#shadow)">
    <rect x="205" y="235" width="650" height="650" rx="72" fill="url(#mid)"/>
  </g>

  <!-- front CV document -->
  <g transform="rotate(-6 590 485)" filter="url(#shadow)">
    <path d="M305 115
             Q305 55 365 55
             H690
             L860 225
             V785
             Q860 845 800 845
             H365
             Q305 845 305 785 Z"
          fill="url(#front)"/>

    <!-- folded corner -->
    <path d="M690 55 V165 Q690 225 750 225 H860 Z" fill="url(#fold)"/>

    <!-- profile -->
    <circle cx="505" cy="285" r="55" fill="url(#rose)"/>
    <path d="M430 405 Q430 330 505 330 Q580 330 580 405
             Q580 430 555 430 H455 Q430 430 430 405Z"
          fill="url(#rose)"/>

    <!-- CV text lines -->
    <rect x="405" y="485" width="370" height="34" rx="17" fill="#f43f5e"/>
    <rect x="405" y="555" width="325" height="28" rx="14" fill="#f9a0b5"/>
    <rect x="405" y="625" width="355" height="28" rx="14" fill="#f9a0b5"/>
    <rect x="405" y="695" width="290" height="28" rx="14" fill="#f9a0b5"/>
  </g>
</svg>
