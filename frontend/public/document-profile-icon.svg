<svg width="1300" height="1150" viewBox="0 0 1300 1150" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Document profile icon</title>
<desc>Three stacked rounded document cards tilted at slight angles: a pale pink back card, a vivid pink middle card, and a white front card with a folded top-right corner, containing a person avatar icon and four horizontal text-line bars, the topmost bar bold in the same vivid pink as the folded corner.</desc>

<!-- back card -->
<g transform="rotate(-14 460 770)">
  <rect x="200" y="420" width="520" height="700" rx="70" fill="#FFD3E2"/>
</g>

<!-- middle card -->
<g transform="rotate(-8 560 705)">
  <rect x="300" y="330" width="560" height="750" rx="75" fill="#F23D82"/>
</g>

<!-- front card -->
<g transform="rotate(-3 720 560)">
  <path d="M 505,140
           L 910,140
           L 1080,310
           L 1080,875
           A 85,85 0 0 1 995,960
           L 505,960
           A 85,85 0 0 1 420,875
           L 420,225
           A 85,85 0 0 1 505,140
           Z" fill="#FFF6F9"/>

  <!-- folded corner flap -->
  <polygon points="910,140 1080,310 910,310" fill="#F0125F"/>

  <!-- person avatar -->
  <circle cx="610" cy="330" r="85" fill="#F2578F"/>
  <path d="M 500,520 A 110,110 0 0 1 720,520 L 720,570 L 500,570 Z" fill="#F2578F"/>

  <!-- text lines -->
  <rect x="510" y="610" width="470" height="50" rx="25" fill="#F0125F"/>
  <rect x="510" y="695" width="430" height="42" rx="21" fill="#F9B8CD"/>
  <rect x="510" y="765" width="460" height="42" rx="21" fill="#F9B8CD"/>
  <rect x="510" y="835" width="400" height="42" rx="21" fill="#F9B8CD"/>
</g>
</svg>
