version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    volumes:
      - backend-temp:/app/temp
    restart: unless-stopped

volumes:
  backend-temp:
