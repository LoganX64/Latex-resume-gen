services:
  - type: web
    name: latex-resume-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SERVER_PORT
        value: "8080"
      - key: COMPILE_TIMEOUT_SECONDS
        value: "120"
      - key: STATS_DB_PATH
        value: /data/stats.db
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
